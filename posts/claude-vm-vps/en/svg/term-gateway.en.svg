<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="592" viewBox="0 0 720 592">
<rect width="720" height="592" fill="#faf9f5"/>
<text x="16" y="28" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.5" fill="#8a8780" letter-spacing="1.6">FIG. 3 · THE NETWORK EACH VM SEES</text><text x="704" y="28" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.5" fill="#8a8780" text-anchor="end">Real output · redacted</text><rect x="16" y="48" width="688" height="148.0" rx="14" fill="#f1efe9"/><text x="36" y="72" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10" fill="#8a8780" letter-spacing="0.6">AIAgentGateway · bash</text><text x="684" y="72" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10" fill="#8a8780" text-anchor="end" letter-spacing="0.6">Debian 13</text><text x="36" y="95.2" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11.2" xml:space="preserve"><tspan fill="#8a8780">hychiiu@AIAgentGateway:~$ </tspan><tspan fill="#141312">ip route</tspan></text><text x="36" y="114.8" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11.2" xml:space="preserve"><tspan fill="#5c5a55">default via 172.16.236.2 dev </tspan><tspan fill="#c56473">enp2s0</tspan><tspan fill="#5c5a55"> proto dhcp src 172.16.236.130 metric 1002</tspan></text><text x="36" y="134.4" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11.2" xml:space="preserve"><tspan fill="#5c5a55">10.10.10.0/24 dev </tspan><tspan fill="#c56473">enp10s0</tspan><tspan fill="#5c5a55"> proto kernel scope link src 10.10.10.1</tspan></text><text x="36" y="154.0" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11.2" xml:space="preserve"><tspan fill="#5c5a55">172.16.236.0/24 dev enp2s0 proto dhcp scope link src 172.16.236.130 metric 1002</tspan></text><rect x="34" y="163.4" width="413.84375" height="16.2" rx="3" fill="rgba(197,100,115,.12)"/><text x="36" y="173.6" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11.2" xml:space="preserve"><tspan fill="#a84e5d">172.19.0.0/30 dev tun0 proto kernel scope link src 172.19.0.1</tspan></text><rect x="16" y="212.0" width="688" height="304.79999999999995" rx="14" fill="#f1efe9"/><text x="36" y="236.0" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10" fill="#8a8780" letter-spacing="0.6">Windows 11 · PowerShell</text><text x="684" y="236.0" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10" fill="#8a8780" text-anchor="end" letter-spacing="0.6">Hostname, MAC, and DUID removed</text><text x="36" y="259.2" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11.2" xml:space="preserve"><tspan fill="#8a8780">PS C:\Users\hychiiu&gt; </tspan><tspan fill="#141312">ipconfig /all</tspan></text><text x="36" y="278.8" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11.2" xml:space="preserve"><tspan fill="#5c5a55">Ethernet adapter Ethernet:</tspan></text><text x="36" y="298.40000000000003" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11.2" xml:space="preserve"><tspan fill="#5c5a55">   Description . . . . . . . . . . . : vmxnet3 Ethernet Adapter</tspan></text><text x="36" y="318.00000000000006" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11.2" xml:space="preserve"><tspan fill="#5c5a55">   DHCP Enabled. . . . . . . . . . . : Yes</tspan></text><text x="36" y="337.6000000000001" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11.2" xml:space="preserve"><tspan fill="#5c5a55">   IPv4 Address. . . . . . . . . . . : </tspan><tspan fill="#c56473">10.10.10.125</tspan><tspan fill="#5c5a55">(Preferred)</tspan></text><text x="36" y="357.2000000000001" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11.2" xml:space="preserve"><tspan fill="#5c5a55">   Subnet Mask . . . . . . . . . . . : 255.255.255.0</tspan></text><rect x="296.03125" y="366.60000000000014" width="71.1875" height="16.2" rx="3" fill="rgba(197,100,115,.12)"/><text x="36" y="376.8000000000001" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11.2" xml:space="preserve"><tspan fill="#5c5a55">   Default Gateway . . . . . . . . . : </tspan><tspan fill="#a84e5d">10.10.10.1</tspan></text><text x="36" y="396.40000000000015" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11.2" xml:space="preserve"><tspan fill="#5c5a55">   DHCP Server . . . . . . . . . . . : 10.10.10.1</tspan></text><text x="36" y="416.00000000000017" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11.2" xml:space="preserve"><tspan fill="#5c5a55">   DNS Servers . . . . . . . . . . . : 10.10.10.1</tspan></text><text x="36" y="435.6000000000002" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11.2" xml:space="preserve"><tspan fill="#8a8780">PS C:\Users\hychiiu&gt; </tspan><tspan fill="#141312">route print -4</tspan></text><text x="36" y="455.2000000000002" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11.2" xml:space="preserve"><tspan fill="#5c5a55">Network Destination        Netmask          Gateway       Interface  Metric</tspan></text><text x="36" y="474.80000000000024" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11.2" xml:space="preserve"><tspan fill="#5c5a55">          0.0.0.0          0.0.0.0       10.10.10.1     10.10.10.125     15</tspan></text><text x="36" y="494.40000000000026" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11.2" xml:space="preserve"><tspan fill="#5c5a55">       10.10.10.0    255.255.255.0         On-link      10.10.10.125    271</tspan></text><text x="16" y="534.8" font-family="Noto Serif, Noto Serif CJK SC, serif" font-size="12.5" fill="#5c5a55">The gateway has an extra tun0, created by sing-box. Windows has a single NIC and a single default route, pointing</text><text x="16" y="554.8" font-family="Noto Serif, Noto Serif CJK SC, serif" font-size="12.5" fill="#5c5a55">at the gateway.</text>
</svg>
