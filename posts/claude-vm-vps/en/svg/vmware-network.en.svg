<text x="36" y="222" font-family="Noto Serif, Noto Serif CJK SC, serif" font-size="15" fill="#141312" font-weight="600">AIAgentGateway</text>
<text x="334" y="222" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.5" fill="#8a8780" text-anchor="end">Two NICs</text>
<line x1="36" y1="238" x2="330" y2="238" stroke="rgba(24,24,27,.07)"/><text x="36" y="256" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" fill="#2b2a27">NIC 1</text><rect x="213.5625" y="243" width="116.4375" height="20" rx="10" fill="none" stroke="rgba(24,24,27,.12)"/><text x="271.78125" y="257" font-family="Noto Serif, Noto Serif CJK SC, serif" font-size="10.5" fill="#5c5a55" text-anchor="middle">Share with my Mac</text><text x="36" y="274" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.5" fill="#5c5a55">enp2s0</text><text x="330" y="274" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.5" fill="#2b2a27" text-anchor="end">172.16.236.x · DHCP</text><line x1="36" y1="290" x2="330" y2="290" stroke="rgba(24,24,27,.07)"/><text x="36" y="308" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" fill="#2b2a27">NIC 2</text><rect x="223.3125" y="295" width="106.6875" height="20" rx="10" fill="rgba(197,100,115,.06)" stroke="rgba(197,100,115,.6)"/><text x="276.65625" y="309" font-family="Noto Serif, Noto Serif CJK SC, serif" font-size="10.5" fill="#c56473" text-anchor="middle">AI Agent Internet</text><text x="36" y="326" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.5" fill="#5c5a55">enp10s0</text><text x="330" y="326" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.5" fill="#2b2a27" text-anchor="end">10.10.10.1 · static</text>
<rect x="366" y="196" width="338" height="168" rx="18" fill="none" stroke="rgba(24,24,27,.12)"/>
<text x="386" y="222" font-family="Noto Serif, Noto Serif CJK SC, serif" font-size="15" fill="#141312" font-weight="600">Windows 11 ARM</text>
<text x="688" y="222" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.5" fill="#8a8780" text-anchor="end">One NIC only</text>
<line x1="386" y1="238" x2="684" y2="238" stroke="rgba(24,24,27,.07)"/><text x="386" y="256" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" fill="#2b2a27">NIC 1</text><rect x="577.3125" y="243" width="106.6875" height="20" rx="10" fill="rgba(197,100,115,.06)" stroke="rgba(197,100,115,.6)"/><text x="630.65625" y="257" font-family="Noto Serif, Noto Serif CJK SC, serif" font-size="10.5" fill="#c56473" text-anchor="middle">AI Agent Internet</text><text x="386" y="274" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.5" fill="#5c5a55">Ethernet</text><text x="684" y="274" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.5" fill="#2b2a27" text-anchor="end">10.10.10.1xx · DHCP</text><line x1="386" y1="290" x2="684" y2="290" stroke="rgba(24,24,27,.07)"/><text x="386" y="308" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" fill="#8a8780">—</text><text x="684" y="308" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" fill="#8a8780" text-anchor="end">No second NIC</text><text x="386" y="326" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.5" fill="#5c5a55">NAT / Bridged</text><text x="684" y="326" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.5" fill="#5c5a55" text-anchor="end">Neither</text><text x="16" y="392" font-family="Noto Serif, Noto Serif CJK SC, serif" font-size="12.5" fill="#5c5a55">With all three options off, this network is just a bare cable: only the two VMs are on it, and Debian issues the</text><text x="16" y="412" font-family="Noto Serif, Noto Serif CJK SC, serif" font-size="12.5" fill="#5c5a55">addresses and the gateway.</text>
