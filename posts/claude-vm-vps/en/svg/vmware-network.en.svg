<text x="16" y="28" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.5" fill="#8a8780" letter-spacing="1.6">FIG. 2 · VMWARE FUSION NETWORK</text><text x="704" y="28" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.5" fill="#8a8780" text-anchor="end">Diagram · not a screenshot</text>
