<text x="38" y="113" font-family="Noto Serif, Noto Serif CJK SC, serif" font-size="13" fill="#2b2a27">Use NAT</text><rect x="238" y="102" width="30" height="17" rx="9" fill="none" stroke="rgba(24,24,27,.22)"/><circle cx="250" cy="110.5" r="4.5" fill="#a8a69f"/><text x="300" y="113" font-family="Noto Serif, Noto Serif CJK SC, serif" font-size="13" fill="#2b2a27">Connect to this Mac</text><rect x="652" y="102" width="30" height="17" rx="9" fill="none" stroke="rgba(24,24,27,.22)"/><circle cx="664" cy="110.5" r="4.5" fill="#a8a69f"/><text x="38" y="149" font-family="Noto Serif, Noto Serif CJK SC, serif" font-size="13" fill="#2b2a27">DHCP</text><rect x="238" y="138" width="30" height="17" rx="9" fill="none" stroke="rgba(24,24,27,.22)"/><circle cx="250" cy="146.5" r="4.5" fill="#a8a69f"/><text x="300" y="149" font-family="Noto Serif, Noto Serif CJK SC, serif" font-size="13" fill="#2b2a27">Subnet</text><text x="682" y="149" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.5" fill="#8a8780" text-anchor="end">Leave to the gateway</text>
