</defs><text x="16" y="30" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.5" fill="#8a8780" letter-spacing="1.6">FIG. 7 · THE TUN AND THE GATEWAY COMPETE</text><text x="704" y="30" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.5" fill="#8a8780" text-anchor="end">Diagram</text><text x="16" y="72" font-family="Noto Serif, Noto Serif CJK SC, serif" font-size="15" fill="#141312" font-weight="600">Before</text><text x="70" y="72" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.5" fill="#8a8780">Traffic from the gateway to the VPS was also swallowed by Egern's TUN</text><rect x="16" y="88" width="118" height="52" rx="12" fill="#faf9f5" stroke="rgba(24,24,27,.24)"/><text x="75.0" y="110" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.5" fill="#2b2a27" text-anchor="middle">Gateway</text><text x="75.0" y="127" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9.5" fill="#8a8780" text-anchor="middle">sing-box</text><rect x="158" y="88" width="118" height="52" rx="12" fill="#faf9f5" stroke="rgba(24,24,27,.24)"/><text x="217.0" y="110" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.5" fill="#2b2a27" text-anchor="middle">VMware NAT</text><text x="217.0" y="127" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9.5" fill="#8a8780" text-anchor="middle">172.16.236.2</text><rect x="300" y="88" width="118" height="52" rx="12" fill="rgba(24,24,27,.03)" stroke="rgba(24,24,27,.3)"/><text x="359.0" y="110" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.5" fill="#2b2a27" text-anchor="middle">Egern utun</text><text x="359.0" y="127" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9.5" fill="#8a8780" text-anchor="middle">TUN · fake-ip</text><rect x="442" y="88" width="118" height="52" rx="12" fill="#faf9f5" stroke="rgba(24,24,27,.24)"/><text x="501.0" y="110" font-family="JetBrains Mono, ui-monospace, monospace" font-siz