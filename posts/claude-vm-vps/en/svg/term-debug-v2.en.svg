<text x="16" y="28" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.5" fill="#8a8780" letter-spacing="1.6">FIG. 9 · THE OUTAGE</text><text x="704" y="28" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.5" fill="#8a8780" text-anchor="end">Real output · redacted · IPs and ports replaced</text><rect x="16" y="48" width="688" height="324.4" rx="14" fill="#f1efe9"/><text x="36" y="72" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10" fill="#8a8780" letter-spacing="0.6">AIAgentGateway · root</text><text x="684" y="72" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10" fill="#8a8780" text-anchor="end" letter-spacing="0.6">Services are up, but nothing gets out</text><text x="36" y="95.2" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11.2" xml:space="preserve"><tspan fill="#8a8780">root@AIAgentGateway:~# </tspan><tspan fill="#141312">systemctl is-active sing-box dnsmasq</tspan></text><text x="36" y="114.8" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11.2" xml:space="preserve"><tspan fill="#5c5a55">active</tspan></text><text x="36" y="134.4" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11.2" xml:space="preserve"><tspan fill="#5c5a55">active</tspan></text><text x="36" y="154.0" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11.2" xml:space="preserve"><tspan fill="#8a8780">root@AIAgentGateway:~# </tspan><tspan fill="#141312">systemctl status sing-box --no-pager -l</tspan></text><text x="36" y="173.6" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11.2" xml:space="preserve"><tspan fill="#5c5a55">     Active: active (running) since Fri 2026-10-23 04:21:10 PDT; 4 days ago</tspan></text><text x="36" y="193.2" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11.2" xml:space="preserve"><tspan fill="#5c5a55">Oct 28 00:26:53 sing-box[964]: ERROR … open connection to 95.101.31.36:80 using</tspan></text><rect x="201.96875" y="202.6" width="24.15625" height="16.2" rx="3" fill="rgba(197,100,115,.12)"/><text x="36" y="212.79999999999998" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11.2" xml:space="preserve"><tspan fill="#5c5a55">outbound/vless[my-node]: </tspan><tspan fill="#a84e5d">EOF</tspan></text><text x="36" y="232.39999999999998" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11.2" xml:space="preserve"><tspan fill="#5c5a55">Oct 28 02:27:06 sing-box[964]: ERROR … open connection to 95.101.31.36:80 using</tspan></text><rect x="201.96875" y="241.79999999999998" width="171.96875" height="16.2" rx="3" fill="rgba(197,100,115,.12)"/><text x="36" y="251.99999999999997" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11.2" xml:space="preserve"><tspan fill="#5c5a55">outbound/vless[my-node]: </tspan><tspan fill="#a84e5d">context deadline exceeded</tspan></text><text x="36" y="271.59999999999997" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11.2" xml:space="preserve"><tspan fill="#8a8780">root@AIAgentGateway:~# </tspan><tspan fill="#141312">timeout 5 bash -c 'echo &gt;/dev/tcp/&lt;VPS_IP&gt;/&lt;PORT&gt;' &amp;&amp; echo TCP_OK || echo</tspan></text><text x="36" y="291.2" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11.2" xml:space="preserve"><tspan fill="#141312">TCP_FAIL</tspan></text><text x="36" y="310.8" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11.2" xml:space="preserve"><tspan fill="#c56473">TCP_OK</tspan></text><text x="36" y="330.40000000000003" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11.2" xml:space="preserve"><tspan fill="#8a8780">root@AIAgentGateway:~# </tspan><tspan fill="#141312">curl -sS --max-time 8 --connect-timeout 5 https://1.1.1.1/cdn-cgi/trace</tspan></text><text x="36" y="350.00000000000006" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11.2" xml:space="preserve"><tspan fill="#5c5a55">curl: (28) Connection timed out after 5003 milliseconds</tspan></text><rect x="16" y="388.4" width="688" height="69.6" rx="14" fill="#f1efe9"/><text x="36" y="412.4" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10" fill="#8a8780" letter-spacing="0.6">VPS · sing-box log</text><text x="684" y="412.4" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10" fill="#8a8780" text-anchor="end" letter-spacing="0.6">Same day</text><rect x="134.78125" y="425.4" width="252.59375" height="16.2" rx="3" fill="rgba(197,100,115,.12)"/><text x="36" y="435.59999999999997" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11.2" xml:space="preserve"><tspan fill="#5c5a55">TLS handshake: </tspan><tspan fill="#a84e5d">REALITY: processed invalid connection</tspan></text><text x="16" y="476.0" font-family="Noto Serif, Noto Serif CJK SC, serif" font-size="12.5" fill="#5c5a55">The port is reachable, but the tunnel will not come up; the server reports an invalid handshake. The problem is not</text><text x="16" y="496.0" font-family="Noto Serif, Noto Serif CJK SC, serif" font-size="12.5" fill="#5c5a55">the node. It is in the middle: the TUN on the Mac intercepts this traffic and forwards it again.</text>
</svg>
