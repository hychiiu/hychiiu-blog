ext x="265.33333333333337" y="78" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.5" fill="#8a8780" letter-spacing="1.26">WINDOWS TIMEZONE</text><text x="265.33333333333337" y="108" font-family="Noto Serif, Noto Serif CJK SC, serif" font-size="20" fill="#141312" font-weight="600">(UTC−08:00)</text><text x="265.33333333333337" y="132" font-family="Noto Serif, Noto Serif CJK SC, serif" font-size="15" fill="#5c5a55">Pacific Time</text><line x1="265.33333333333337" y1="154" x2="454.6666666666667" y2="154" stroke="rgba(24,24,27,.07)"/><text x="265.33333333333337" y="176" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.5" fill="#8a8780">ID</text><text x="265.33333333333337" y="192" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.5" fill="#2b2a27">Pacific Standard Time</text><line x1="265.33333333333337" y1="200" x2="454.6666666666667" y2="200" stroke="rgba(24,24,27,.07)"/><text x="265.33333333333337" y="224" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.5" fill="#8a8780">Check</text><text x="265.33333333333337" y="240" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.5" fill="#2b2a27">tzutil /g</text><line x1="265.33333333333337" y1="248" x2="454.6666666666667" y2="248" stroke="rgba(24,24,27,.07)"/><text x="265.33333333333337" y="272" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.5" fill="#8a8780">Set time zone automatically</text><text x="265.33333333333337" y="288" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.5" fill="#2b2a27">Turn this off</text><rect x="482.6666666666667" y="50" width="221.33333333333334" height="276" rx="18" fill="#faf9f5" stroke="rgba(24,24,27,.12)"/><text x="498.6666666666667" y="78" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.5" fill="#8a8780" letter-spacing="1.26">Language &amp; input</text><text x="498.6666666666667" y="108" font-family="Noto Serif, Noto Serif CJK SC, serif" font-size="20" fill="#141312" font-weight="600">English (US)</text><text x="498.6666666666667" y="132" font-family="Noto Serif, Noto Serif CJK SC, serif" font-size="15" fill="#5c5a55">+ Chinese IME</text><line x1="498.6666666666667" y1="154" x2="688.0" y2="154" stroke="rgba(24,24,27,.07)"/><text x="498.6666666666667" y="176" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.5" fill="#8a8780">Display language</text><text x="498.6666666666667" y="192" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.5" fill="#2b2a27">English (United States)</text><line x1="498.6666666666667" y1="200" x2="688.0" y2="200" stroke="rgba(24,24,27,.07)"/><text x="498.6666666666667" y="224" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.5" fill="#8a8780">Input method</text><text x="498.6666666666667" y="240" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.5" fill="#2b2a27">Chinese (Simplified)</text><line x1="498.6666666666667" y1="248" x2="688.0" y2="248" stroke="rgba(24,24,27,.07)"/><text x="498.6666666666667" y="272" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.5" fill="#8a8780">Check</text><text x="498.6666666666667" y="288" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.5" fill="#2b2a27">Get-WinUserLanguageList</text><text x="16" y="354" font-family="Noto Serif, Noto Serif CJK SC, serif" font-size="13" fill="#5c5a55">The timezone only affects display. TLS and REALITY care whether the UTC clock is accurate, not which zone</text><text x="16" y="376" font-family="Noto Serif, Noto Serif CJK SC, serif" font-size="13" fill="#5c5a55">you set.</text>
