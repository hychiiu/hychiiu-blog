="none" stroke="#2b2a27" stroke-width="1.2"/><text x="90" y="401" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.5" fill="#2b2a27">Windows</text><text x="90" y="416" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9.5" fill="#8a8780">.125</text><text x="98" y="452" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9.5" fill="#8a8780" text-anchor="middle">No second NIC</text><rect x="176" y="372" width="104" height="60" rx="14" fill="none" stroke="rgba(24,24,27,.28)" stroke-dasharray="4 4"/><text x="228" y="398" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.5" fill="#8a8780" text-anchor="middle">Gateway</text><text x="228" y="414" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9.5" fill="#8a8780" text-anchor="middle">off</text><g transform="translate(362,402)" opacity="0.45"><circle r="20" fill="#faf9f5" stroke="#2b2a27" stroke-width="1.1"/><ellipse rx="8.4" ry="20" fill="none" stroke="#2b2a27" stroke-width="0.8"/><line x1="-20" x2="20" stroke="#2b2a27" stroke-width="0.8"/><path d="M-17.2 -10.0 H17.2 M-17.2 10.0 H17.2" stroke="#2b2a27" stroke-width="0.7"/></g><line x1="154" y1="402" x2="172" y2="402" stroke="rgba(24,24,27,.35)" stroke-width="1.3" stroke-dasharray="3 3"/><line x1="280" y1="402" x2="336" y2="402" stroke="rgba(24,24,27,.25)" stroke-width="1.3" stroke-dasharray="3 3"/><g transform="translate(164,402)" stroke="#c56473" stroke-width="1.8" stroke-linecap="round"><line x1="-6" y1="-6" x2="6" y2="6"/><line x1="6" y1="-6" x2="-6" y2="6"/></g><line x1="424" y1="308" x2="424" y2="480" stroke="rgba(24,24,27,.08)"/><text x="448" y="372" font-family="Noto Serif, Noto Serif CJK SC, serif" font-size="13.5" fill="#5c5a55">Windows has no other way out. When</text><text x="448" y="394" font-family="Noto Serif, Noto Serif CJK SC, serif" font-size="13.5" fill="#5c5a55">the gateway stops, the network is</text><text x="448" y="416" font-family="Noto Serif, Noto Serif CJK SC, serif" font-size="13.5" fill="#5c5a55">simply gone — it will not fall back to</text><text x="448" y="438" font-family="Noto Serif, Noto Serif CJK SC, serif" font-size="13.5" fill="#5c5a55">the host egress.</text><text x="448" y="480" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10" fill="#8a8780">Expected: ping 8.8.8.8 fails</text>
