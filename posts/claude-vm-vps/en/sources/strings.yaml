# Maintainable English copy for the 10 claude-vm-vps figures.
# Chinese is the published original (v2) for verification only.
# Do not invent topology, security boundaries, IPs, or features.
# Placeholders (<VPS_IP>, <PORT>, <API_KEY>, <your-domain>) stay as in the original.
# Brand "hychiiu" is kept. No new secrets, emails, or real IPs.

meta:
  article_en: "https://hychiiu.com/en/posts/claude-vm-vps/"
  issue_en: "https://github.com/hychiiu/hychiiu-blog/issues/3"
  issue_zh: "https://github.com/hychiiu/hychiiu-blog/issues/2"
  assets_branch: "https://github.com/hychiiu/hychiiu-blog/tree/assets/posts/claude-vm-vps"
  palette_note: >
    Site chrome uses pine green, but these figures were drawn with a warm-paper
    plus dusty-rose accent. English assets keep that original figure palette
    so they pair with the Chinese set and preserve color semantics (paths,
    highlights, kill-switch state).

