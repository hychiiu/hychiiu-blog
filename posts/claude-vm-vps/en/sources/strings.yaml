checklist-v2:
  role: "Fig. 8 · Checklist"
  kicker: {zh: "FIG. 8 · CHECKLIST", en: "FIG. 8 · CHECKLIST"}
  badge: {zh: "每次换节点、改配置后过一遍", en: "Walk this after every node or config change"}
  title: {zh: "改完之后的八项检查", en: "Eight checks after a change"}
  sub: {zh: "从网关到浏览器再到 CPA，一层一层确认没有漏。",
        en: "From the gateway to the browser to CPA, confirm layer by layer that nothing leaks."}
  items:
    - n: "01"
      title: {zh: "网关出口", en: "Gateway egress"}
      how: {zh: "curl -s https://api.ipify.org", en: "curl -s https://api.ipify.org"}
      pass: {zh: "= <VPS_IP>", en: "= <VPS_IP>"}
    - n: "02"
      title: {zh: "Windows 的地址", en: "Windows address"}
      how: {zh: "ipconfig /all", en: "ipconfig /all"}
      pass: {zh: "10.10.10.1xx · GW/DNS .1", en: "10.10.10.1xx · GW/DNS .1"}
    - n: "03"
      title: {zh: "浏览器看到的 IP", en: "IP in the browser"}
      how: {zh: "任意 IP 查询页", en: "Any IP lookup page"}
      pass: {zh: "美国 · 和 VPS 一致", en: "US · matches the VPS"}
    - n: "04"
      title: {zh: "DNS 泄漏", en: "DNS leak"}
      how: {zh: "DNS leak test · 扩展测试", en: "DNS leak test · extended"}
      pass: {zh: "不出现国内运营商", en: "No domestic ISP"}
    - n: "05"
      title: {zh: "WebRTC", en: "WebRTC"}
      how: {zh: "WebRTC leak test", en: "WebRTC leak test"}
      pass: {zh: "没有真实公网 IP", en: "No real public IP"}
    - n: "06"
      title: {zh: "时区与语言", en: "Timezone & language"}
      how: {zh: "Intl…timeZone · tzutil /g", en: "Intl…timeZone · tzutil /g"}
      pass: {zh: "America/Los_Angeles", en: "America/Los_Angeles"}
    - n: "07"
      title: {zh: "Kill switch", en: "Kill switch"}
      how: {zh: "挂起网关 → Windows 里 ping", en: "Suspend gateway → ping in Windows"}
      pass: {zh: "不通才对", en: "Failure is correct"}
    - n: "08"
      title: {zh: "CPA 接口", en: "CPA API"}
      how: {zh: "curl /v1/models + API Key", en: "curl /v1/models + API Key"}
      pass: {zh: "返回模型列表", en: "Returns the model list"}

term-debug-v2:
  role: "Fig. 9 · Services are up, but nothing gets out (real output, redacted)"
  kind: real_terminal
  kicker: {zh: "FIG. 9 · 那次断网", en: "FIG. 9 · THE OUTAGE"}
  badge: {zh: "真实输出 · 有删节 · IP 和端口已替换", en: "Real output · redacted · IPs and ports replaced"}
  gw_head: {zh: "AIAgentGateway · root", en: "AIAgentGateway · root"}
  gw_note: {zh: "服务都在，就是出不去", en: "Services are up, but nothing gets out"}
  vps_head: {zh: "VPS · sing-box 日志", en: "VPS · sing-box log"}
  vps_when: {zh: "同一天", en: "Same day"}
  caption: {zh: "端口是通的，隧道却建不起来；服务端说握手无效。问题不在节点，而在中间：Mac 上的 TUN 把这段流量截走又转了一道。",
            en: "The port is reachable, but the tunnel will not come up; the server reports an invalid handshake. The problem is not the node. It is in the middle: the TUN on the Mac intercepts this traffic and forwards it again."}
  output_note: >
    Command output and the VPS log line are already English, including the
    published placeholder <VPS_IP>/<PORT> and the destination 95.101.31.36
    from the original. Keep them verbatim. Do not forge a screenshot or
    restore redacted values. No translated-transcript label is needed
    because the output itself is not being rewritten.
